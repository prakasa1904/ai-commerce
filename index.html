<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farm Fresh Marketplace</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f1f5f9; }
    #root { min-height: 100vh; padding: 32px; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.2); border-top: 4px solid #22c55e; border-radius: 50%; animation: spin 1s linear infinite; margin: 200px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 24px; }
    .product { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 24px; backdrop-filter: blur(12px); }
    .product img { width: 100%; height: 160px; object-fit: cover; border-radius: 16px; margin-bottom: 16px; }
    .product h3 { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #e2e8f0; }
    .product p { font-size: 14px; color: #94a3b8; margin-bottom: 16px; }
    .price { font-size: 20px; font-weight: 700; color: #22c55e; }
    .button { margin-top: 16px; padding: 10px 20px; border-radius: 12px; border: none; background: #22c55e; color: #fff; font-weight: 600; cursor: pointer; }
    .search { width: 100%; padding: 12px 20px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03); color: #f1f5f9; font-size: 16px; outline: none; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div id="root">
    <div class="spinner"></div>
  </div>
  <script>
    const { createRoot } = ReactDOM;
    const { useState, useEffect } = React;

    const ProductCard = ({ product, onAddToCart }) => (
      React.createElement('article', { className: 'product' },
        React.createElement('img', { src: product.imageUrl, alt: product.title }),
        React.createElement('h3', null, product.title),
        React.createElement('p', null, product.description),
        React.createElement('div', null,
          React.createElement('span', { className: 'price' }, 'Rp ' + (product.price/100).toFixed(2)),
          React.createElement('button', { className: 'button', onClick: () => onAddToCart(product.id) }, 'Add to Cart')
        )
      )
    );

    const App = () => {
      const [products, setProducts] = useState([]);
      const [query, setQuery] = useState('');

      useEffect(() => {
        axios.get('/api/products')
          .then(res => setProducts(res.data.products || []))
          .catch(err => console.error('Error:', err));
      }, []);

      const filtered = products.filter(p => !query || p.title.toLowerCase().includes(query.toLowerCase()));

      return React.createElement('div', { style: { maxWidth: '1400px', margin: '0 auto' } },
        React.createElement('h1', { style: { letterSpacing: '-1px' } }, '🌾 Farm Fresh Marketplace'),
        React.createElement('input', { 
          type: 'text', 
          className: 'search', 
          placeholder: 'Search products...', 
          value: query, 
          onChange: e => setQuery(e.target.value) 
        }),
        React.createElement('div', { className: 'grid' },
          filtered.map(p => React.createElement(ProductCard, { key: p.id, product: p, onAddToCart: () => alert(p.title + ' added!') }))
        )
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
